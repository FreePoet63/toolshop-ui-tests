name: Toolshop UI tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Checkout Toolshop application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Start Toolshop application
        working-directory: toolshop-app
        run: docker compose up -d

      - name: Wait for application startup
        run: |
          timeout 900 bash -c 'until curl -sf http://localhost:8091/api/documentation >/dev/null; do sleep 5; done'
          timeout 900 bash -c 'until curl -sf http://localhost:4200 >/dev/null; do sleep 5; done'

      - name: Prepare database
        working-directory: toolshop-app
        run: |
          docker compose exec -T -u root laravel-api chown -R www-data:www-data storage bootstrap/cache
          docker compose exec -T -u root laravel-api chmod -R 777 storage bootstrap/cache

          docker compose exec -T laravel-api php artisan optimize:clear

          docker compose exec -T laravel-api php artisan migrate:fresh --seed

      - name: Verify database content
        working-directory: toolshop-app
        run: |
          docker compose exec -T laravel-api php artisan tinker --execute="dump(DB::connection()->getDatabaseName());"
          docker compose exec -T laravel-api php artisan tinker --execute="dump(DB::table('products')->count());"
          docker compose exec -T laravel-api php artisan tinker --execute="dump(DB::table('brands')->count());"
          docker compose exec -T laravel-api php artisan tinker --execute="dump(DB::table('categories')->count());"

      - name: Print Laravel routes
        working-directory: toolshop-app
        run: |
          echo "=== ROUTE LIST ==="
          docker compose exec -T laravel-api php artisan route:list

      - name: Check API endpoints
        run: |
          echo "=== Swagger ==="
          curl -i http://localhost:8091/api/documentation || true

          echo ""
          echo "=== Products ==="
          curl -i http://localhost:8091/api/products || true

      # No continue-on-error: if tests fail the whole run is red,
      # while the steps below with "if: always()" still build the report.
      - name: Run UI tests
        run: >
          mvn clean test
          -Dheadless=true
          -Dbrowser=firefox
          -Dbase.url=http://localhost:4200
          -Dapi.url=http://localhost:8091

      - name: Show Laravel errors
        if: failure()
        working-directory: toolshop-app
        run: |
          docker compose exec -T laravel-api sh -lc \
          'if [ -f storage/logs/laravel.log ]; then tail -n 300 storage/logs/laravel.log; else echo "laravel.log not found"; fi' || true

      - name: Show Docker logs
        if: failure()
        working-directory: toolshop-app
        run: |
          docker compose logs --no-color --tail=500 || true

      # ---------- Allure report with history ----------

      - name: Load previous Allure report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into results
        if: always()
        run: |
          mkdir -p target/allure-results/history
          cp -r gh-pages/history/* target/allure-results/history/ 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure report
        if: always()
        run: allure generate target/allure-results --clean -o allure-report

      # The report is published only from main, so a draft branch never overwrites the stable one
      - name: Deploy report to GitHub Pages
        if: always() && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
