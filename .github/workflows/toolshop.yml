name: Toolshop UI tests

on:
  push:
    branches:
      - master            # после слияния: обновляем отчёт Allure на Pages
  pull_request:         # внутри PR: проверка кода до слияния
  workflow_dispatch:    # ручной запуск кнопкой

permissions:
  contents: write

# Запуски одной ветки идут по очереди, чтобы не писать в gh-pages одновременно
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      # Повторы упавших тестов делает Retry (TestNG), параметр surefire не нужен.
      # Шаг без continue-on-error: если тесты упали, весь запуск красный,
      # а шаги ниже с if: always() всё равно выполнятся и соберут отчёт.
      - name: Run tests
        run: >
          mvn clean test
          -Dheadless=true
          -Dbrowser=firefox
      - name: Load previous Allure report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy history into results
        if: always()
        run: |
          mkdir -p target/allure-results/history
          cp -r gh-pages/history/* target/allure-results/history/ 2>/dev/null || true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure report
        if: always()
        run: allure generate target/allure-results --clean -o allure-report

      # Публикуем отчёт только из main, чтобы черновая ветка не перезаписала рабочий отчёт
      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          
